name: Website CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source and static export (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        profile: [same-origin, pages]
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      WEBSITE_BUILD_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Verify tooling and source
        run: |
          git rev-parse HEAD
          test "$(node --version)" = 'v24.20.0'
          test "$(npm --version)" = '11.19.0'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source and static export
        run: npm run validate
      - name: Verify source and lockfile remain unchanged
        if: always()
        run: git diff --exit-code HEAD -- .
